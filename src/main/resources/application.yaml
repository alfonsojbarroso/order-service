server:
  port: 8080

url:
  order: orders
  notification-service: http://localhost:8092

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver
    # Cofiguración de TTL, para Redis
  cache-ttl: 36000 #86400

  jpa:
    hibernate:
      ddl-auto: update # En producción usar tools como Flyway o validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.order.service.dto.BillingDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topics:
      order-events: "order-events-topic"
      billing-events: "billing-events-topic"
      
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1 # Envuelve por fuera (es el primero en evaluar)
    instances:
      notificationService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50.0
        slowCallRateThreshold: 50.0
        slowCallDurationThreshold: 2s
        waitDurationInState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    retryAspectOrder: 2 # Se ejecuta por dentro (maneja los intentos)
    instances:
      notificationServiceRetry:
        maxAttempts: 3 # Intento inicial + 2 reintentos adicionales
        waitDuration: 5s # Espera de 5 segundos entre cada intento
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

logging:
  level:
    root: WARN
    com.order.service: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
